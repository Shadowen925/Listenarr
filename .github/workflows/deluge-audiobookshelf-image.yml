name: Deluge + Audiobookshelf image

on:
  push:
    branches: [feature/deluge-audiobookshelf]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deluge-abs-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/run-tests.yml

  publish:
    needs: tests
    if: github.ref == 'refs/heads/feature/deluge-audiobookshelf'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore solution
        run: dotnet restore listenarr.slnx

      - name: Build solution
        run: dotnet build listenarr.slnx --no-restore --configuration Release

      - name: Build frontend
        working-directory: fe
        run: |
          npm ci
          npm run build

      - name: Publish Docker runtime payloads
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            if [ "$arch" = "amd64" ]; then rid=linux-x64; else rid=linux-arm64; fi
            dotnet publish listenarr.api/Listenarr.Api.csproj \
              -c Release -r "$rid" --no-restore --self-contained false \
              /p:UseAppHost=false -o "listenarr.api/docker-publish/$arch"

            bot_dir="listenarr.api/docker-publish/$arch/tools/discord-bot"
            if [ ! -d "$bot_dir" ]; then
              mkdir -p "listenarr.api/docker-publish/$arch/tools"
              cp -R tools/discord-bot "$bot_dir"
            fi
            rm -rf "$bot_dir/node_modules"
            test -f "$bot_dir/package-lock.json"
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish tested integration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: listenarr.api/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/shadowen925/listenarr:deluge-abs
